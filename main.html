    .game3 { background-color: rgba(59, 130, 246, 0.7);}
    .game4 { background-color: rgba(234, 179, 8, 0.7);}

    .cell span.small {
      display: block;
      font-size: 14px;
      opacity: 0.6;
      margin-top: 5px;
    }
  </style>
</head>
